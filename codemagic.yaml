# Ironverse iOS — Codemagic cloud builds (macOS + Xcode in the cloud; nothing here runs on Windows).
# Docs: docs/IOS.md. Free plan: 500 macOS (M2) minutes / month. One build ≈ 10–15 min.
# No secrets live in this file: signing comes from the App Store Connect API key you add
# in Codemagic → Team settings → Integrations, under the name below.

workflows:
  # 1) Works TODAY with no Apple account: proves the native project compiles (simulator, unsigned).
  ios-compile-check:
    name: Ironverse iOS — compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build web bundle (iOS edition)
        script: npm run build:ios && node tools/verify-ios-build.mjs
      - name: Sync native project
        script: npx cap sync ios
      - name: Compile for the iOS simulator (unsigned)
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty || exit ${PIPESTATUS[0]}

  # 2) After Apple Developer enrollment + the ASC API key: signed build → TestFlight.
  #    Manual start only. It never submits for App Store review.
  ios-testflight:
    name: Ironverse iOS — signed build to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Ironverse ASC key
    environment:
      node: 22
      xcode: latest
      # pinned (23 Oct 2026): the HealthKit profile — the older ironverse_app_store
      # profile is INVALID since HealthKit was switched on for the App ID
      ios_signing:
        provisioning_profiles:
          - ironverse_app_store_healthkit
          - ironverse_watch_app_store
        certificates:
          - ironverse_distribution
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # App Store Connect → your app → App Information → Apple ID (a number). Fill after the app record exists.
        APP_STORE_APPLE_ID: 6825232233
    scripts:
      - name: Install
        script: npm ci
      - name: Unit tests
        script: npm test
      - name: Build web bundle (iOS edition)
        script: npm run build:ios && node tools/verify-ios-build.mjs
      - name: Sync native project
        script: npx cap sync ios
      - name: Add the Apple Watch app
        script: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --user-install
          ruby tools/watch/add_watch_target.rb
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number (one higher than the latest TestFlight build)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # internal testers (group "Nouri") get every build automatically; external beta
        # review needs public test info we do not use, so do not submit for it
        submit_to_testflight: false
        submit_to_app_store: false   # App Store review only after the owner approves it

  # 3) Listing chores through the App Store Connect API (manual start only):
  #    attach a build to version 1.0.0, App Review contact/notes, subscription review
  #    screenshots. Never submits for review, never changes prices. See tools/asc/listing.py.
  asc-listing:
    name: Ironverse — App Store Connect listing (API)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Ironverse ASC key
    environment:
      vars:
        APP_STORE_APPLE_ID: 6825232233
        IV_BUILD: 3
    scripts:
      - name: Listing via App Store Connect API
        script: |
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -n "${!v}" ]; then echo "$v present"; else echo "$v MISSING"; fi
          done
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 tools/asc/listing.py

  # 4) Signing chores via the App Store Connect API (manual start only): turn on the
  #    HealthKit capability and create an App Store profile that includes it.
  #    Then Codemagic → Team settings → Code signing identities → Fetch profiles.
  asc-signing:
    name: Ironverse — signing (HealthKit capability + profile)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Ironverse ASC key
    scripts:
      - name: HealthKit capability and profile
        script: |
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 tools/asc/signing.py

  # 5) Apple Watch app compile check (manual, unsigned, simulator) — proves the
  #    watchOS target and Swift sources build before a signed TestFlight run.
  watch-compile-check:
    name: Ironverse — Apple Watch compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Build web bundle (iOS edition)
        script: npm run build:ios
      - name: Sync native project
        script: npx cap sync ios
      - name: Add the Apple Watch target
        script: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --user-install
          ruby tools/watch/add_watch_target.rb
      - name: Compile iPhone + Watch for the simulator (unsigned)
        script: |
          set -o pipefail
          # no -sdk flag: each target keeps its own SDK (the Watch app builds with watchOS)
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty

  # 6) Read-only TestFlight status (manual): what Apple has done with recent uploads.
  asc-status:
    name: Ironverse — TestFlight status (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Ironverse ASC key
    scripts:
      - name: TestFlight builds
        script: |
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 tools/asc/status.py
